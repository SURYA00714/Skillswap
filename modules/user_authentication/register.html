<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration - SwapSkills Authentication Module</title>
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/module.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header bar with Navigation & Theme Toggle -->
  <div style="position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100;">
    <a href="./index.html" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.25); padding: 8px 14px; border-radius: 20px; backdrop-filter: blur(8px);">
      <i class="fas fa-arrow-left"></i> Module Hub
    </a>
    <button class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Light / Dark Mode">
      <span class="theme-toggle-thumb"><i class="fas fa-moon"></i></span>
      <span class="theme-toggle-text">Theme</span>
    </button>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <i class="fas fa-user-plus"></i>
          <span>SkillSwap</span>
        </div>
        <h2>Create Account</h2>
        <p>Register as a new member in the skills ecosystem</p>
      </div>

      <!-- Registration Form -->
      <form class="auth-form" id="emailSignUpForm">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. name@example.com" required autocomplete="email">
        </div>
        
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a strong password (min 6 chars)" required minlength="6" autocomplete="new-password">
          <div class="password-strength" id="passwordStrength"></div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
          <div class="password-match" id="passwordMatch"></div>
        </div>

        <div class="input-group">
          <label for="gender">Gender</label>
          <select id="gender" style="width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--surface); color: var(--text); box-sizing: border-box;">
            <option value="Prefer not to say" selected>Prefer not to say</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-binary">Non-binary</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="signUpBtn">
          <i class="fas fa-check-circle"></i>
          Register Account
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>Or connect with</span>
      </div>

      <!-- Social Auth -->
      <div class="social-auth">
        <button type="button" class="btn btn-google" onclick="signInWithGoogle()">
          <i class="fab fa-google"></i>
          Continue with Google
        </button>
      </div>

      <div class="auth-footer">
        <p>Already registered? <a href="./login.html">Sign In here</a></p>
        <div class="terms" style="margin-top: 10px; font-size: 0.75rem; color: var(--text-light);">
          Standalone live module &bull; No external backend server required
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/theme.js"></script>
  <script src="./js/auth-standalone.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupRegistration();
    });
  </script>
</body>
</html>
