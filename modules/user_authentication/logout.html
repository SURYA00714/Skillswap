<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signed Out - SwapSkills Authentication Module</title>
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/module.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header bar with Navigation & Theme Toggle -->
  <div style="position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100;">
    <a href="./index.html" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.25); padding: 8px 14px; border-radius: 20px; backdrop-filter: blur(8px);">
      <i class="fas fa-arrow-left"></i> Module Hub
    </a>
    <button class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Light / Dark Mode">
      <span class="theme-toggle-thumb"><i class="fas fa-moon"></i></span>
      <span class="theme-toggle-text">Theme</span>
    </button>
  </div>

  <div class="auth-container">
    <div class="auth-card" style="text-align: center;">
      <div style="width: 72px; height: 72px; background: rgba(16, 185, 129, 0.12); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px;">
        <i class="fas fa-check"></i>
      </div>

      <h2 style="font-size: 1.5rem; margin-bottom: 8px; color: var(--text);">Signed Out Successfully</h2>
      <p style="color: var(--text-light); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5;">
        Your active session and credentials have been safely cleared from this browser.
      </p>

      <div style="background: var(--surface-dark); border-radius: 8px; padding: 14px; margin-bottom: 24px; font-size: 0.85rem; color: var(--text-light);">
        Redirecting to sign-in page in <strong id="countdown" style="color: var(--primary);">5</strong> seconds...
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="./login.html" class="btn btn-primary btn-full" style="text-decoration: none; justify-content: center; display: inline-flex;">
          <i class="fas fa-sign-in-alt"></i> Sign In Again
        </a>
        <a href="./index.html" class="btn" style="text-decoration: none; justify-content: center; display: inline-flex; background: var(--surface-dark); color: var(--text); border: 1px solid var(--border);">
          <i class="fas fa-th-large"></i> Go to Module Hub
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/theme.js"></script>
  <script src="./js/auth-standalone.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Clear session immediately upon visiting logout page
      clearCurrentSession();
      showToast('Session ended securely.', 'info');

      let timeLeft = 5;
      const countdownEl = document.getElementById('countdown');
      const timer = setInterval(() => {
        timeLeft -= 1;
        if (countdownEl) countdownEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          window.location.href = './login.html';
        }
      }, 1000);
    });
  </script>
</body>
</html>
